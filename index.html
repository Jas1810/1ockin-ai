<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 學習助理 (AI Study Hub)</title>
  <!-- 載入 Tailwind CSS 樣式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Mermaid.js 資訊圖表渲染庫 -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false });</script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <header class="text-center py-4 border-b">
      <h1 class="text-3xl font-bold text-indigo-600">📚 AI 學生筆記轉換平台</h1>
      <p class="text-slate-500 text-sm mt-1">上傳或貼上課堂筆記，一鍵轉化為 Podcast、圖表、Flashcards 同測驗</p>
    </header>

    <!-- API Key 輸入區 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <label class="block text-sm font-semibold mb-1">OpenAI 或 Gemini API Key：</label>
      <input type="password" id="apiKey" placeholder="貼上你嘅 API Key (例如 sk-...)" class="w-full p-2 border rounded-lg text-sm">
    </div>

    <!-- 筆記輸入區 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <label class="block text-sm font-semibold mb-1">課堂筆記內容：</label>
      <textarea id="noteContent" rows="6" placeholder="喺度貼上你嘅講義文字或課堂重點..." class="w-full p-3 border rounded-lg text-sm"></textarea>
      
      <!-- 功能按鈕區 -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-4">
        <button onclick="transform('summary')" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-lg text-xs font-semibold">📝 結構化重點</button>
        <button onclick="transform('infographic')" class="bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg text-xs font-semibold">📊 資訊圖表</button>
        <button onclick="transform('podcast')" class="bg-amber-600 hover:bg-amber-700 text-white p-2 rounded-lg text-xs font-semibold">🎙️ Podcast 語音</button>
        <button onclick="transform('flashcards')" class="bg-rose-600 hover:bg-rose-700 text-white p-2 rounded-lg text-xs font-semibold">🎴 Flashcards</button>
        <button onclick="transform('quiz')" class="bg-purple-600 hover:bg-purple-700 text-white p-2 rounded-lg text-xs font-semibold">✏️ 練習測驗</button>
      </div>
    </div>

    <!-- 結果顯示區 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[200px]">
      <h2 class="text-lg font-bold mb-3 border-b pb-2">轉換結果：</h2>
      <div id="loading" class="hidden text-indigo-600 font-semibold animate-pulse">AI 正在努力分析及轉換中，請稍候...</div>
      <div id="output" class="prose max-w-none text-sm">請喺上方輸入筆記並點擊功能按鈕。</div>
      <div id="mermaidOutput" class="mt-4 flex justify-center"></div>
      <div id="audioPlayer" class="hidden mt-4">
        <button onclick="playPodcast()" class="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-bold">▶️ 播放/暫停 Podcast 語音</button>
      </div>
    </div>
  </div>

  <script>
    let podcastScript = "";

    async function transform(type) {
      const apiKey = document.getElementById('apiKey').value;
      const text = document.getElementById('noteContent').value;
      const output = document.getElementById('output');
      const loading = document.getElementById('loading');
      const mermaidOutput = document.getElementById('mermaidOutput');
      const audioPlayer = document.getElementById('audioPlayer');

      if (!apiKey || !text) {
        alert("請輸入 API Key 同埋筆記內容！");
        return;
      }

      loading.classList.remove('hidden');
      output.innerHTML = "";
      mermaidOutput.innerHTML = "";
      audioPlayer.classList.add('hidden');

      let prompt = "";
      if (type === 'summary') prompt = `請將以下筆記整理成結構清晰嘅 Markdown 格式總結：\n\n${text}`;
      if (type === 'infographic') prompt = `請將以下筆記改寫為 Mermaid.js 嘅 graph TD 或 mindmap 圖表代碼。只返回 ```mermaid ... ``` 代碼區塊：\n\n${text}`;
      if (type === 'podcast') prompt = `請將以下筆記改寫為一段二人對話（Host 同 Expert）嘅 Podcast 廣播劇本（使用繁體中文）：\n\n${text}`;
      if (type === 'flashcards') prompt = `請將以下筆記製作成 5 張 Flashcards（格式為：【Q: 問題】\n【A: 答案】）：\n\n${text}`;
      if (type === 'quiz') prompt = `請根據以下筆記出 3 題選擇題（包含題目、A/B/C/D 選項、答案同解析）：\n\n${text}`;

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [{ role: "user", content: prompt }]
          })
        });

        const data = await response.json();
        const result = data.choices[0].message.content;
        loading.classList.add('hidden');

        if (type === 'infographic') {
          const cleanCode = result.replace(/```mermaid/g, '').replace(/```/g, '').trim();
          mermaidOutput.innerHTML = `<pre class="mermaid">${cleanCode}</pre>`;
          mermaid.run();
        } else if (type === 'podcast') {
          podcastScript = result;
          output.innerText = result;
          audioPlayer.classList.remove('hidden');
        } else {
          output.innerText = result;
        }
      } catch (err) {
        loading.classList.add('hidden');
        output.innerText = "發生錯誤：請檢查 API Key 是否正確。" + err;
      }
    }

    // 利用瀏覽器自帶嘅 Web Speech API 免費發聲
    function playPodcast() {
      if ('speechSynthesis' in window) {
        if (speechSynthesis.speaking) {
          speechSynthesis.cancel();
        } else {
          const utterance = new SpeechSynthesisUtterance(podcastScript);
          utterance.lang = 'zh-HK'; // 廣東話發聲
          speechSynthesis.speak(utterance);
        }
      } else {
        alert("你嘅瀏覽器唔支援語音播放。");
      }
    }
  </script>
</body>
</html>
