<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 學習助理 (Memo AI 語音增強版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false });</script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <header class="text-center py-4 border-b">
      <h1 class="text-3xl font-bold text-indigo-600">🎙️ AI 語音轉筆記學習平台 (Memo AI Style)</h1>
      <p class="text-slate-500 text-sm mt-1">錄音或上傳音訊檔 ➔ Whisper AI 自動轉文字 ➔ 一鍵生成心智圖與測驗</p>
    </header>

    <!-- API Key 輸入區 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <label class="block text-sm font-semibold mb-1">OpenAI API Key (需支援 Whisper 及 GPT-4o)：</label>
      <input type="password" id="apiKey" placeholder="貼上你嘅 API Key (sk-...)" class="w-full p-2 border rounded-lg text-sm">
    </div>

    <!-- Memo AI 核心語音處理區 -->
    <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 space-y-3">
      <h2 class="text-base font-bold text-indigo-900 flex items-center gap-2">
        <span>🎙️</span> Memo AI 語音轉文字功能
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- 錄音控制 -->
        <div class="bg-white p-4 rounded-lg border border-indigo-100 flex flex-col justify-between">
          <label class="block text-xs font-semibold text-slate-600 mb-2">1. 現場即時錄音（錄課堂/會議）：</label>
          <div class="flex items-center gap-2">
            <button id="recordBtn" onclick="toggleRecording()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex-1">
              🔴 開始錄音
            </button>
            <span id="recordStatus" class="text-xs text-slate-500 font-mono">未錄音</span>
          </div>
        </div>
        <!-- 上傳音訊 -->
        <div class="bg-white p-4 rounded-lg border border-indigo-100 flex flex-col justify-between">
          <label class="block text-xs font-semibold text-slate-600 mb-2">2. 或上傳錄音檔案 (.mp3, .m4a, .wav)：</label>
          <input type="file" id="audioFileInput" accept="audio/*" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200">
        </div>
      </div>
      <button onclick="transcribeAudio()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-xs font-bold transition">
        ⚡ 執行 Whisper AI 語音轉文字 (Transcribe)
      </button>
    </div>

    <!-- 筆記文字區 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <label class="block text-sm font-semibold mb-1">逐字稿 / 課堂筆記內容：</label>
      <textarea id="noteContent" rows="6" placeholder="轉譯後嘅文字會自動填入呢度，你亦可以直接喺度貼上文字..." class="w-full p-3 border rounded-lg text-sm"></textarea>
      
      <!-- AI 轉換按鈕區 -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-4">
        <button onclick="transform('summary')" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-lg text-xs font-semibold">📝 結構化重點</button>
        <button onclick="transform('infographic')" class="bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg text-xs font-semibold">📊 Memo 心智圖</button>
        <button onclick="transform('podcast')" class="bg-amber-600 hover:bg-amber-700 text-white p-2 rounded-lg text-xs font-semibold">🎙️ Podcast 語音</button>
        <button onclick="transform('flashcards')" class="bg-rose-600 hover:bg-rose-700 text-white p-2 rounded-lg text-xs font-semibold">🎴 Flashcards</button>
        <button onclick="transform('quiz')" class="bg-purple-600 hover:bg-purple-700 text-white p-2 rounded-lg text-xs font-semibold">✏️ 練習測驗</button>
      </div>
    </div>

    <!-- 結果顯示區 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[200px]">
      <h2 class="text-lg font-bold mb-3 border-b pb-2">轉換結果：</h2>
      <div id="loading" class="hidden text-indigo-600 font-semibold animate-pulse">AI 正在處理中，請稍候...</div>
      <div id="output" class="prose max-w-none text-sm whitespace-pre-line">請先錄音/上傳音訊轉成文字，再點擊 AI 功能按鈕。</div>
      <div id="mermaidOutput" class="mt-4 flex justify-center"></div>
      <div id="audioPlayer" class="hidden mt-4">
        <button onclick="playPodcast()" class="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-bold">▶️ 播放 Podcast 語音</button>
      </div>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let recordedBlob = null;
    let podcastScript = "";

    // 1. 錄音功能
    async function toggleRecording() {
      const btn = document.getElementById('recordBtn');
      const status = document.getElementById('recordStatus');

      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
          mediaRecorder.onstop = () => {
            recordedBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            status.innerText = "錄音完成！";
            status.classList.add("text-emerald-600", "font-bold");
          };

          mediaRecorder.start();
          btn.innerText = "⏹️ 停止錄音";
          btn.classList.replace('bg-rose-500', 'bg-slate-700');
          status.innerText = "錄音中...";
        } catch (err) {
          alert("無法獲取麥克風權限：" + err.message);
        }
      } else {
        mediaRecorder.stop();
        btn.innerText = "🔴 重新錄音";
        btn.classList.replace('bg-slate-700', 'bg-rose-500');
      }
    }

    // 2. 呼叫 Whisper API 語音轉文字 (Transcribe)
    async function transcribeAudio() {
      const apiKey = document.getElementById('apiKey').value;
      const fileInput = document.getElementById('audioFileInput');
      const loading = document.getElementById('loading');
      const noteContent = document.getElementById('noteContent');

      if (!apiKey) {
        alert("請輸入 OpenAI API Key！");
        return;
      }

      let audioFile = fileInput.files[0] || recordedBlob;
      if (!audioFile) {
        alert("請先錄音或選擇一個音訊檔案！");
        return;
      }

      loading.classList.remove('hidden');
      loading.innerText = "Whisper AI 正在將語音轉換為文字，請稍候...";

      const formData = new FormData();
      formData.append('file', audioFile, 'recording.mp3');
      formData.append('model', 'whisper-1');

      try {
        const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${apiKey}` },
          body: formData
        });

        const data = await response.json();
        loading.classList.add('hidden');

        if (data.text) {
          noteContent.value = data.text;
          alert("語音轉換完成！逐字稿已自動填入文字框。");
        } else {
          alert("轉換失敗：" + (data.error ? data.error.message : "未知錯誤"));
        }
      } catch (err) {
        loading.classList.add('hidden');
        alert("請求失敗：" + err.message);
      }
    }

    // 3. AI 重點 / 圖表 / 測驗 轉換管線
    async function transform(type) {
      const apiKey = document.getElementById('apiKey').value;
      const text = document.getElementById('noteContent').value;
      const output = document.getElementById('output');
      const loading = document.getElementById('loading');
      const mermaidOutput = document.getElementById('mermaidOutput');
      const audioPlayer = document.getElementById('audioPlayer');

      if (!apiKey || !text) {
        alert("請確保已有 API Key 同埋逐字稿文字！");
        return;
      }

      loading.classList.remove('hidden');
      loading.innerText = "AI 正在生成中...";
      output.innerText = "";
      mermaidOutput.innerHTML = "";
      audioPlayer.classList.add('hidden');

      let prompt = "";
      if (type === 'summary') prompt = `請將以下逐字稿整理成 Memo AI 風格嘅結構化重點摘要（條理分明、附帶核心結論與關鍵字）：\n\n${text}`;
      if (type === 'infographic') prompt = `請將以下逐字稿概念轉化為 Mermaid.js 嘅 mindmap 語法。只返回 ```mermaid ... ``` 代碼區塊：\n\n${text}`;
      if (type === 'podcast') prompt = `將以下文字改寫成雙人對話 Podcast 劇本：\n\n${text}`;
      if (type === 'flashcards') prompt = `根據文字製作 5 張 Flashcards【Q: ...】\n【A: ...】：\n\n${text}`;
      if (type === 'quiz') prompt = `根據文字出 3 題選擇題（附選項與答案解析）：\n\n${text}`;

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [{ role: "user", content: prompt }]
          })
        });

        const data = await response.json();
        const result = data.choices[0].message.content;
        loading.classList.add('hidden');

        if (type === 'infographic') {
          const cleanCode = result.replace(/```mermaid/g, '').replace(/```/g, '').trim();
          mermaidOutput.innerHTML = `<pre class="mermaid">${cleanCode}</pre>`;
          mermaid.run();
        } else if (type === 'podcast') {
          podcastScript = result;
          output.innerText = result;
          audioPlayer.classList.remove('hidden');
        } else {
          output.innerText = result;
        }
      } catch (err) {
        loading.classList.add('hidden');
        output.innerText = "發生錯誤：" + err.message;
      }
    }

    function playPodcast() {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(podcastScript);
        utterance.lang = 'zh-HK';
        speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
